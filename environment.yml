# SpatialRx-BRCA — canonical reproduction environment (conda)
#
# This is the environment from which CANONICAL outputs must be regenerated.
# It intentionally uses pandas 2.x + anndata 0.12.19 and numpy < 2.2, matching
# the evidence available for the environment that produced modules 00–08
# (see docs/04_REMEDIATION_GATE_REPORT.md, "Environment reconstruction").
#
# The CITEgeist / cuOPT stack (which forces pandas 3.x here) is ISOLATED in a
# separate environment; see environment/requirements-citegeist.txt.
#
# Create:
#   conda env create -f environment.yml
#   conda activate spatialrx-canon
#   pip install -r environment/requirements-torch-cpu.txt   # CPU torch (separate index)
#
# Then freeze the exact resolved set:
#   pip freeze > requirements.lock
name: spatialrx-canon
channels:
  - defaults
dependencies:
  - python=3.11.15
  - pip
  - pip:
      - numpy==2.1.3
      - scipy==1.15.3
      - pandas==2.2.3
      - anndata==0.12.19
      - scanpy==1.11.5
      - squidpy==1.8.2
      - decoupler==2.2.0
      - scikit-learn==1.6.1
      - statsmodels==0.14.6
      - matplotlib==3.10.0
      - seaborn==0.13.2
      - harmonypy==2.0.0
      - scikit-misc==0.5.1
      - leidenalg==0.10.2
      - igraph==0.11.8
      - numba==0.61.0
      - h5py==3.13.0
      - pillow==11.1.0
